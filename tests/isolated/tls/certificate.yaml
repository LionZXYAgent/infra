apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: isolated-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: isolated-tls
  namespace: traefik
spec:
  secretName: isolated-tls
  dnsNames:
    - demo.infra.test
  issuerRef:
    kind: ClusterIssuer
    name: isolated-selfsigned
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: isolated-tls
