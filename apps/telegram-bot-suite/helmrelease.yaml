# Keep this release suspended until the coordinated cutover.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telegram-bot-suite
spec:
  releaseName: telegram-bot-suite
  interval: 10m
  timeout: 5m
  suspend: true
  chart:
    spec:
      chart: ./charts/telegram-bot-suite
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: telegram-bot-suite
      interval: 10m
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  driftDetection:
    mode: enabled
  # The pinned chart supplies worker defaults and hardcodes the seed resources.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: telegram-bot-suite
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: telegram-bot-suite
          spec:
            template:
              spec:
                initContainers:
                - name: seed-gateway
                  resources:
                    requests:
                      memory: null
                    limits:
                      memory: null
                containers:
                - name: acorn
                  resources:
                    requests:
                      memory: null
                    limits:
                      memory: null
                - name: greenwich
                  resources:
                    requests:
                      memory: null
                    limits:
                      memory: null
                - name: gateway
                  resources:
                    requests:
                      memory: null
                    limits:
                      memory: null
  values:
    fullnameOverride: telegram-bot-suite
    replicas: 0
    image: ghcr.io/lionzxyorg/acorn-care-bot:sha-6db3fab40a7bbc59ccc01c2310128ef6eae98f03@sha256:4ef10858647eb4c731f4188ebcd71c5861f1e4bbf72d9ff209b41aaaa20dc093
    gateway:
      tokenSecret:
        name: acorn-care-bot
        key: bot-token
      persistence:
        size: 128Mi
        storageClassName: local-path
    legacyAcorn:
      workerId: acorn
    workers:
    - id: acorn
      uid: 10001
      command:
      - python3
      - /app/service.py
      route:
        chat_id: -1004424243504
        topic_id: 210
        receives_updates: true
        allowed_user_ids:
        - 474744725
        - 1235433892
        methods:
        - getMe
        - getWebhookInfo
        - getChatMember
        - getUpdates
        - sendMessage
        - editMessageText
        - answerCallbackQuery
      env:
        ACORN_CONFIG_PATH: /etc/worker/config.json
        ACORN_STATE_PATH: /data/state.json
        ACORN_FRESH_START: '1'
      persistence:
        existingClaim: acorn-care-bot-state
