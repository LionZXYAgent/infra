apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot-suite
spec:
  # Prepare only. Stop the existing senders before a coordinated cutover.
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-bot-suite
  template:
    metadata:
      labels:
        app: telegram-bot-suite
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        # The shared group permits socket access. The gateway checks peer UIDs.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Export only old message receipts, before any new worker starts.
      initContainers:
        - name: seed-gateway
          image: ghcr.io/lionzxyorg/acorn-care-bot:sha-f6658c9c51c9396dd19c8f625e533df6e4296812@sha256:3ed868e07c00d0e9dabc0b5f578102552ab2dd0e8621227b20aecfc843f8a9ba
          imagePullPolicy: IfNotPresent
          command: [python3, /app/gateway_seed.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                configMapKeyRef:
                  name: telegram-suite-acorn-config
                  key: TELEGRAM_CHAT_ID
            - name: TELEGRAM_TOPIC_ID
              valueFrom:
                configMapKeyRef:
                  name: telegram-suite-acorn-config
                  key: TELEGRAM_TOPIC_ID
            - name: GATEWAY_STATE_PATH
              value: /gateway/private/state.sqlite3
            - name: GATEWAY_LEGACY_PATH
              value: /gateway/legacy.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: acorn-state
              mountPath: /legacy
              readOnly: true
            - name: gateway-state
              mountPath: /gateway
      containers:
        - name: acorn
          image: ghcr.io/lionzxyorg/acorn-care-bot:sha-f6658c9c51c9396dd19c8f625e533df6e4296812@sha256:3ed868e07c00d0e9dabc0b5f578102552ab2dd0e8621227b20aecfc843f8a9ba
          imagePullPolicy: IfNotPresent
          command: [python3, /app/service.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TELEGRAM_GATEWAY_SOCKET
              value: /run/telegram/private/api.sock
            - name: ACORN_CONFIG_PATH
              value: /etc/acorn/config.json
            - name: ACORN_STATE_PATH
              value: /data/state.json
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                configMapKeyRef:
                  name: telegram-suite-acorn-config
                  key: TELEGRAM_CHAT_ID
            - name: TELEGRAM_TOPIC_ID
              valueFrom:
                configMapKeyRef:
                  name: telegram-suite-acorn-config
                  key: TELEGRAM_TOPIC_ID
            - name: TELEGRAM_ALLOWED_USER_IDS
              valueFrom:
                configMapKeyRef:
                  name: telegram-suite-acorn-config
                  key: TELEGRAM_ALLOWED_USER_IDS
            - name: ACORN_FRESH_START
              valueFrom:
                configMapKeyRef:
                  name: telegram-suite-acorn-config
                  key: ACORN_FRESH_START
          ports:
            - name: acorn-health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: acorn-health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: acorn-health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: acorn-health
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: acorn-state
              mountPath: /data
            - name: acorn-configuration
              mountPath: /etc/acorn
              readOnly: true
            - name: acorn-socket
              mountPath: /run/telegram
              readOnly: true
            - name: acorn-tmp
              mountPath: /tmp
        - name: greenwich
          image: ghcr.io/lionzxyorg/acorn-care-bot:sha-f6658c9c51c9396dd19c8f625e533df6e4296812@sha256:3ed868e07c00d0e9dabc0b5f578102552ab2dd0e8621227b20aecfc843f8a9ba
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/bins/runner.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /app
            - name: TELEGRAM_GATEWAY_SOCKET
              value: /run/telegram/private/api.sock
            - name: BINS_PROPERTY_PATH
              value: /etc/bins/property.json
            - name: BINS_STATE_PATH
              value: /data/state.json
            - name: BINS_CACHE_PATH
              value: /data/council-cache.json
          startupProbe:
            exec:
              command: [python3, /opt/bins/runner.py, health]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: [python3, /opt/bins/runner.py, health]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: [python3, /opt/bins/runner.py, health]
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: greenwich-state
              mountPath: /data
            - name: greenwich-property
              mountPath: /etc/bins
              readOnly: true
            - name: greenwich-code
              mountPath: /opt/bins
              readOnly: true
            - name: greenwich-socket
              mountPath: /run/telegram
              readOnly: true
            - name: greenwich-tmp
              mountPath: /tmp
        - name: gateway
          image: ghcr.io/lionzxyorg/acorn-care-bot:sha-f6658c9c51c9396dd19c8f625e533df6e4296812@sha256:3ed868e07c00d0e9dabc0b5f578102552ab2dd0e8621227b20aecfc843f8a9ba
          imagePullPolicy: IfNotPresent
          command: [python3, /app/gateway.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TELEGRAM_BOT_TOKEN_FILE
              value: /var/run/acorn/token
            - name: GATEWAY_CONFIG_PATH
              value: /etc/gateway/registry.json
            - name: GATEWAY_STATE_PATH
              value: /gateway/private/state.sqlite3
            - name: GATEWAY_HTTP_PORT
              value: "8081"
            - name: GATEWAY_LEGACY_PATH
              value: /gateway/legacy.json
          ports:
            - name: gateway-health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: gateway-health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: gateway-health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway-health
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10003
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: gateway-state
              mountPath: /gateway
            - name: telegram-token
              mountPath: /var/run/acorn
              readOnly: true
            - name: gateway-registry
              mountPath: /etc/gateway
              readOnly: true
            - name: acorn-socket
              mountPath: /run/workers/acorn
            - name: greenwich-socket
              mountPath: /run/workers/greenwich
            - name: gateway-tmp
              mountPath: /tmp
      volumes:
        - name: acorn-state
          persistentVolumeClaim:
            claimName: acorn-care-bot-state
        - name: acorn-configuration
          configMap:
            name: telegram-suite-acorn-config
            defaultMode: 0444
            items:
              - key: config.json
                path: config.json
        - name: greenwich-state
          persistentVolumeClaim:
            claimName: greenwich-bin-bot-state
        - name: greenwich-property
          secret:
            secretName: greenwich-bin-bot-property
            defaultMode: 0440
            items:
              - key: property.json
                path: property.json
        - name: greenwich-code
          configMap:
            name: greenwich-bin-bot-code
            defaultMode: 0444
        - name: gateway-state
          persistentVolumeClaim:
            claimName: telegram-bot-gateway-state
        - name: telegram-token
          secret:
            secretName: acorn-care-bot
            defaultMode: 0440
            items:
              - key: bot-token
                path: token
        - name: gateway-registry
          configMap:
            name: telegram-bot-gateway-registry
            defaultMode: 0444
            items:
              - key: registry.json
                path: registry.json
        - name: acorn-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: greenwich-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: acorn-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: greenwich-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: gateway-tmp
          emptyDir:
            sizeLimit: 16Mi
