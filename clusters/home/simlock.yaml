apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: simlock
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-namespaces
    - name: infra-tls
  interval: 1m
  retryInterval: 30s
  timeout: 10m
  path: ./apps/simlock
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
