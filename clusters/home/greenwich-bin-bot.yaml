apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: greenwich-bin-bot
  namespace: flux-system
spec:
  # Prepare only. Preserve the current reminder until a coordinated cutover.
  suspend: true
  dependsOn:
    - name: infra-namespaces
    - name: cluster-secrets
    - name: acorn-care-bot
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./apps/greenwich-bin-bot
  targetNamespace: acorn-care-bot
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
