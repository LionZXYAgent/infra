apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: acorn-care-bot
  namespace: flux-system
spec:
  suspend: false
  dependsOn:
  - name: infra-namespaces
  - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/standalone
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: acorn-care-bot
  targetNamespace: acorn-care-bot
  images:
  - name: ghcr.io/lionzxyorg/acorn-care-bot
    newTag: sha-786f4974e399642bb49063b5711f1d91e5e91b52
    digest: sha256:728e611085ac031c3cfbebab649db54f2dbc09787aa0e9c78d4dc667d9baa156
