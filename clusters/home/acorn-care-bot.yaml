apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: acorn-care-bot
  namespace: flux-system
spec:
  suspend: false
  dependsOn:
  - name: infra-namespaces
  - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/standalone
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: acorn-care-bot
  targetNamespace: acorn-care-bot
  images:
  - name: ghcr.io/lionzxyorg/acorn-care-bot
    newTag: sha-80e95c5e676a7d6ff3cfad4e4b8fcc657989f5bd
    digest: sha256:050e36971742960fc3d1bb0db44c5e18c94ec58e0e910260c535bf279009fd2c
