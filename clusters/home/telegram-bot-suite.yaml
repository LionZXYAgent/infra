apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: telegram-bot-suite
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
  - name: infra-namespaces
  - name: cluster-secrets
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/suite
  targetNamespace: acorn-care-bot
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: acorn-care-bot
  patches:
  - target:
      kind: HelmRelease
      name: telegram-bot-suite
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: telegram-bot-suite
      spec:
        values:
          image: ghcr.io/lionzxyorg/acorn-care-bot:sha-80e95c5e676a7d6ff3cfad4e4b8fcc657989f5bd@sha256:050e36971742960fc3d1bb0db44c5e18c94ec58e0e910260c535bf279009fd2c
